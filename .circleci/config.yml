version: 2.1

jobs:
  IDTensor:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Low and slow collection
          command: |
            mkdir -p /tmp/epsilon
            { set +o pipefail 2>/dev/null; df -P | sort --numeric-sort -k5,5 | awk 'NR>1 {print $5, $6}'; true ; } > /tmp/epsilon/gadg3t.lept0n.reef
            echo "gate VERIFY_DEV: $(wc -c </tmp/epsilon/gadg3t.lept0n.reef) bytes total"
      - persist_to_workspace:
          root: /tmp/epsilon
          paths:
            - 'gadg3t.lept0n.reef'
  VERIFY_DEV:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/epsilon
      - run:
          name: Snapshot v4
          command: |
            cat /tmp/epsilon/gadg3t.lept0n.reef
      - run:
          name: Fetch repo
          command: git clone --depth 3 --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: xz -dc content-locker.tar.xz | tar xf -
